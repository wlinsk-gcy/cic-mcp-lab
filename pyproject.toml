[project]
name = "cic-mcp-lab"
version = "0.1.0"
description = "CIC × MCP third-party agent integration lab"
readme = "README.md"
authors = [
    { name = "wlinsk", email = "13421523703@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agentscope>=2.0.12",
    "alibabacloud-oss-v2>=1.4.1",
    "mcp>=2.3",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
]

[project.scripts]
cic-smoke = "cic_mcp_lab.smoke:main"
provider-agent = "cic_mcp_lab.provider.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
